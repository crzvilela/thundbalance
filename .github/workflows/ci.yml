name: CI

# On every push and every pull request: the frontend (lint, tests, build) and the backend (the whole suite against a real PostgreSQL).
# It never needs a secret: the database is a throw-away service container and every other value is invented. Real credentials (Firebase,
# Google, e-mail) are never available here: the tests replace those services with fakes.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (eslint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests (node --test)
        run: node --test "src/**/*.test.js"
      - name: Accessibility and form tests (vitest + jsdom + axe)
        run: npm run test:a11y
      - run: npm run build
      - name: Audit of the dependencies that reach the site (does not stop the build)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  backend:
    name: Backend (unittest against PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: thundbalance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # a database on this very machine (the tests refuse to write anywhere else); the password is the service container's own, invented one
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/thundbalance
      ADMIN_EMAIL: admin@example.test
      PYTHONPATH: backend
      # the anti-robot challenge (backend/challenge.py) is switched off for the suite; it only works against a database on this very machine
      CHALLENGE_ENFORCE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Create the base tables and the minimum data (the rest is created by the server's own idempotent start-up code)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/ci/schema.sql -f backend/ci/seed.sql
      - name: Tests
        working-directory: backend
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Audit of the Python dependencies (installed only here, never in production; does not stop the build)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
        continue-on-error: true
